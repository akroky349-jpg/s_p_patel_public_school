<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="#4C1D95" />
  <circle cx="350" cy="160" r="130" fill="#8B5CF6" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="350" cy="160" r="70" fill="none" stroke="url(#goldLuxe)" stroke-width="3" />
  <polygon points="350,110 365,145 400,145 370,165 385,200 350,180 315,200 330,165 300,145 335,145" fill="url(#goldLuxe)" />
  
  <text x="350" y="270" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">CULTURAL FESTIVALS &amp; PERFORMING ARTS</text>
  <text x="350" y="305" font-family="'DM Sans', sans-serif" font-size="14" fill="#FDE68A" text-anchor="middle">Celebrating Heritage, Music, Drama &amp; Dance</text>
  <text x="350" y="335" font-family="'DM Sans', sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">S. P. Patel Public School • Co-Curricular Excellence</text>
  
  <rect x="20" y="420" width="310" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">CULTURAL FESTIVALS &amp; PERFORMING ARTS</text>

</svg>