<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="#F8FAFC" />
  <!-- Back Wall &amp; Windows -->
  <rect x="0" y="0" width="700" height="300" fill="#E2E8F0" />
  <g fill="url(#glassGrad)" stroke="#64748B" stroke-width="2">
    <rect x="50" y="40" width="120" height="140" /><rect x="200" y="40" width="120" height="140" />
  </g>
  <!-- Smart Board -->
  <rect x="360" y="35" width="280" height="155" rx="6" fill="#0F172A" stroke="url(#goldLuxe)" stroke-width="3" />
  <text x="500" y="90" font-family="'Playfair Display', serif" font-size="18" fill="#FFFFFF" text-anchor="middle">Smart Digital Classroom</text>
  <text x="500" y="120" font-family="'DM Sans', sans-serif" font-size="12" fill="#38BDF8" text-anchor="middle">Interactive Touch Panel &amp; Audio Visual</text>
  <text x="500" y="145" font-family="'DM Sans', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Ventilated, Ergonomic, Climate-Friendly</text>
  <!-- Floor &amp; Modern Desks -->
  <polygon points="0,480 700,480 700,300 0,300" fill="#CBD5E1" />
  <g fill="#1E293B">
    <rect x="80" y="330" width="150" height="65" rx="4" fill="#3B82F6" />
    <rect x="270" y="330" width="150" height="65" rx="4" fill="#3B82F6" />
    <rect x="460" y="330" width="150" height="65" rx="4" fill="#3B82F6" />
  </g>
  <!-- Title Tag -->
  <rect x="20" y="420" width="260" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SMART DIGITAL CLASSROOMS</text>

</svg>