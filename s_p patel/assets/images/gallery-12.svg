<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="#1E293B" />
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="url(#goldLuxe)" stroke-width="2" />
  <circle cx="400" cy="250" r="120" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2" />
  <circle cx="400" cy="250" r="70" fill="url(#goldLuxe)" opacity="0.3" filter="url(#softGlow)" />
  <polygon points="400,200 415,235 450,235 420,255 435,290 400,270 365,290 380,255 350,235 385,235" fill="url(#goldLuxe)" />
  
  <!-- Category Pill -->
  <rect x="330" y="350" width="140" height="32" rx="16" fill="url(#goldLuxe)" />
  <text x="400" y="371" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#102B45" text-anchor="middle" letter-spacing="1.5">CAMPUS</text>
  
  <text x="400" y="420" font-family="'Playfair Display', serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Assembly Ground &amp; Tricolor Flag Hoisting</text>
  <text x="400" y="455" font-family="'DM Sans', sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">S. P. Patel Public School • Bhanauri, Prayagraj</text>
  
  <rect x="0" y="530" width="800" height="70" fill="url(#navyDeep)" opacity="0.9" />
  <text x="40" y="570" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Assembly Ground &amp; Tricolor Flag Hoisting</text>
  <text x="760" y="570" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#D4AF65" text-anchor="end">VIEW IN LIGHTBOX</text>

</svg>