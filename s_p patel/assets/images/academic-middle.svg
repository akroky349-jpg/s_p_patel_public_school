<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="600" height="420" fill="#EFF6FF" />
  <rect x="80" y="40" width="440" height="200" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
  <text x="300" y="85" font-family="'DM Sans', sans-serif" font-size="15" fill="#38BDF8" text-anchor="middle">Middle Stage (Classes 6 - 8)</text>
  <text x="300" y="125" font-family="'Playfair Display', serif" font-size="23" fill="#FFFFFF" text-anchor="middle">Experiential STEM &amp; Humanities</text>
  <!-- Scientific formulas &amp; symbols -->
  <text x="300" y="165" font-family="'DM Sans', sans-serif" font-size="15" fill="#FCD34D" text-anchor="middle">E = mc²  •  H₂O  •  a² + b² = c²  •  Logic</text>
  <text x="300" y="195" font-family="'DM Sans', sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Critical Thinking • Projects • Scientific Inquiry</text>
  <rect x="0" y="260" width="600" height="160" fill="#CBD5E1" />
  <!-- Lab Bench Setup -->
  <rect x="120" y="290" width="360" height="70" rx="4" fill="#334155" />
  <!-- Microscope symbol -->
  <circle cx="200" cy="320" r="12" fill="#D4AF65" />
  <circle cx="400" cy="320" r="12" fill="#38BDF8" />

</svg>