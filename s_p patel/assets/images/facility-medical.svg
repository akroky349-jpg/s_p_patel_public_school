<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="#F8FAFC" />
  <rect x="0" y="0" width="700" height="300" fill="#EFF6FF" />
  <!-- Red Cross Emblem -->
  <circle cx="350" cy="110" r="45" fill="#FFFFFF" stroke="#EF4444" stroke-width="3" />
  <rect x="340" y="80" width="20" height="60" fill="#EF4444" />
  <rect x="320" y="100" width="60" height="20" fill="#EF4444" />
  <text x="350" y="185" font-family="'Playfair Display', serif" font-size="20" font-weight="700" fill="#102B45" text-anchor="middle">School Healthcare &amp; Infirmary</text>
  <text x="350" y="215" font-family="'DM Sans', sans-serif" font-size="13" fill="#64748B" text-anchor="middle">Qualified Medical Care • First Aid • Routine Health Check-ups</text>
  <!-- Infirmary Bed &amp; Table -->
  <polygon points="0,480 700,480 700,300 0,300" fill="#E2E8F0" />
  <rect x="150" y="320" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
  <rect x="160" y="330" width="40" height="25" rx="4" fill="#93C5FD" />
  <rect x="420" y="310" width="130" height="85" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" />
  <!-- Title Tag -->
  <rect x="20" y="420" width="280" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">FIRST AID &amp; HEALTH WELLNESS</text>

</svg>