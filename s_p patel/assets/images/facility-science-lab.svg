<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="#0F172A" />
  <!-- Periodic Table Poster -->
  <rect x="60" y="30" width="260" height="150" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <text x="190" y="65" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">PERIODIC TABLE OF ELEMENTS</text>
  <g fill="#334155" stroke="#475569" stroke-width="1">
    <rect x="80" y="85" width="20" height="20" /><rect x="105" y="85" width="20" height="20" /><rect x="130" y="85" width="20" height="20" /><rect x="155" y="85" width="20" height="20" />
    <rect x="80" y="110" width="20" height="20" /><rect x="105" y="110" width="20" height="20" /><rect x="130" y="110" width="20" height="20" /><rect x="155" y="110" width="20" height="20" />
  </g>
  <!-- Scientific Lab Glassware -->
  <rect x="360" y="40" width="280" height="140" rx="6" fill="#1E293B" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="500" y="85" font-family="'Playfair Display', serif" font-size="18" fill="#FFFFFF" text-anchor="middle">Composite Science Lab</text>
  <text x="500" y="120" font-family="'DM Sans', sans-serif" font-size="12" fill="#A7F3D0" text-anchor="middle">Physics • Chemistry • Biology Apparatus</text>
  <text x="500" y="145" font-family="'DM Sans', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Equipped with strict safety standards</text>
  <!-- Black Granite Lab Counter -->
  <polygon points="0,480 700,480 700,280 0,280" fill="#020617" />
  <rect x="50" y="310" width="600" height="90" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2" />
  <!-- Beakers &amp; Flasks with Glowing Liquids -->
  <path d="M 120 370 L 135 340 L 145 340 L 160 370 Z" fill="#06B6D4" stroke="#67E8F9" stroke-width="2" opacity="0.8" />
  <path d="M 220 375 L 230 330 L 240 330 L 250 375 Z" fill="#EC4899" stroke="#F472B6" stroke-width="2" opacity="0.8" />
  <circle cx="340" cy="350" r="16" fill="#10B981" stroke="#34D399" stroke-width="2" opacity="0.8" />
  <!-- Title Tag -->
  <rect x="20" y="420" width="260" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">MODERN SCIENCE LABORATORIES</text>

</svg>