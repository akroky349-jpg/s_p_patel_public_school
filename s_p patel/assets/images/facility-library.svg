<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="#1C1917" />
  <!-- Grand Wooden Bookshelves -->
  <g fill="#451A03" stroke="#291102" stroke-width="2">
    <rect x="30" y="30" width="180" height="280" />
    <rect x="230" y="30" width="240" height="280" />
    <rect x="490" y="30" width="180" height="280" />
  </g>
  <!-- Book rows -->
  <g fill="url(#goldLuxe)">
    <rect x="45" y="50" width="15" height="40" /><rect x="65" y="45" width="20" height="45" fill="#DC2626" /><rect x="90" y="52" width="14" height="38" fill="#2563EB" /><rect x="110" y="48" width="18" height="42" fill="#059669" />
    <rect x="245" y="50" width="20" height="40" fill="#DC2626" /><rect x="270" y="45" width="16" height="45" fill="#D4AF65" /><rect x="290" y="52" width="22" height="38" fill="#2563EB" /><rect x="315" y="48" width="18" height="42" fill="#FFFFFF" />
  </g>
  <!-- Reading Floor &amp; Lamps -->
  <polygon points="0,480 700,480 700,310 0,310" fill="#292524" />
  <rect x="150" y="340" width="400" height="70" rx="4" fill="#78350F" stroke="#451A03" stroke-width="2" />
  <!-- Desk Lamp -->
  <circle cx="350" cy="330" r="12" fill="#FBBF24" filter="url(#softGlow)" />
  <line x1="350" y1="330" x2="350" y2="350" stroke="#D4AF65" stroke-width="3" />
  <!-- Title Tag -->
  <rect x="20" y="420" width="260" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">KNOWLEDGE RESOURCE CENTRE</text>

</svg>