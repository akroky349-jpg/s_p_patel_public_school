<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="600" height="420" fill="#FFFBEB" />
  <!-- Colorful Classroom Wall -->
  <rect x="0" y="0" width="600" height="280" fill="#FEF3C7" />
  <!-- Alphabet Banner -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="45" height="50" rx="4" fill="#EF4444" /><text x="22" y="36" font-family="'DM Sans', sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">A</text>
    <rect x="60" y="0" width="45" height="50" rx="4" fill="#3B82F6" /><text x="82" y="36" font-family="'DM Sans', sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">B</text>
    <rect x="120" y="0" width="45" height="50" rx="4" fill="#10B981" /><text x="142" y="36" font-family="'DM Sans', sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">C</text>
    <rect x="180" y="0" width="45" height="50" rx="4" fill="#F59E0B" /><text x="202" y="36" font-family="'DM Sans', sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">1</text>
    <rect x="240" y="0" width="45" height="50" rx="4" fill="#8B5CF6" /><text x="262" y="36" font-family="'DM Sans', sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">2</text>
    <rect x="300" y="0" width="45" height="50" rx="4" fill="#EC4899" /><text x="322" y="36" font-family="'DM Sans', sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
  </g>
  <!-- Wooden Play Cubbies &amp; Blocks -->
  <rect x="0" y="280" width="600" height="140" fill="#E2E8F0" />
  <!-- Round Activity Table -->
  <ellipse cx="300" cy="330" rx="140" ry="50" fill="#60A5FA" stroke="#2563EB" stroke-width="3" />
  <circle cx="240" cy="320" r="14" fill="#F43F5E" />
  <circle cx="360" cy="320" r="14" fill="#10B981" />
  <polygon points="300,295 315,325 285,325" fill="#FBBF24" />
  <text x="300" y="390" font-family="'Playfair Display', serif" font-size="20" font-weight="700" fill="#102B45" text-anchor="middle">Pre-Primary (Nursery to UKG)</text>

</svg>