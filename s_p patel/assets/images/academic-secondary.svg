<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="600" height="420" fill="#F8FAFC" />
  <rect x="60" y="35" width="480" height="210" rx="8" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="3" />
  <text x="300" y="80" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#D4AF65" text-anchor="middle" letter-spacing="2">SECONDARY &amp; SR. SECONDARY (CLASSES 9 - 12)</text>
  <text x="300" y="125" font-family="'Playfair Display', serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Academic Rigour &amp; Career Focus</text>
  <text x="300" y="165" font-family="'DM Sans', sans-serif" font-size="14" fill="#E2E8F0" text-anchor="middle">Board Exam Excellence • Science, Commerce &amp; Humanities</text>
  <text x="300" y="195" font-family="'DM Sans', sans-serif" font-size="13" fill="#FDE68A" text-anchor="middle">Comprehensive Guidance • Competitive Prep • Leadership</text>
  <!-- Modern Library study desks -->
  <rect x="0" y="265" width="600" height="155" fill="#E2E8F0" />
  <rect x="80" y="295" width="440" height="75" rx="4" fill="#1E293B" stroke="#D4AF65" stroke-width="1.5" />
  <text x="300" y="340" font-family="'DM Sans', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fostering Visionary Leaders of Tomorrow</text>

</svg>