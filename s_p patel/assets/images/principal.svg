<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="600" height="700" fill="url(#navyDeep)" />
  <!-- Elegant Library Bookshelf Background Pattern -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1">
    <rect x="40" y="40" width="520" height="620" fill="none" stroke="url(#goldLuxe)" stroke-width="2" />
    <line x1="60" y1="120" x2="540" y2="120" />
    <line x1="60" y1="200" x2="540" y2="200" />
    <line x1="60" y1="280" x2="540" y2="280" />
    <line x1="60" y1="360" x2="540" y2="360" />
    <line x1="60" y1="440" x2="540" y2="440" />
    <!-- Book Spines -->
    <rect x="80" y="70" width="15" height="50" fill="#D4AF65" />
    <rect x="100" y="65" width="20" height="55" fill="#FFFFFF" />
    <rect x="125" y="75" width="18" height="45" fill="#D4AF65" />
    <rect x="450" y="70" width="22" height="50" fill="#FFFFFF" />
    <rect x="480" y="60" width="16" height="60" fill="#D4AF65" />
  </g>

  <!-- Ornate Oval Portrait Frame -->
  <ellipse cx="300" cy="330" rx="190" ry="240" fill="none" stroke="url(#goldLuxe)" stroke-width="4" filter="url(#cardDrop)" />
  <ellipse cx="300" cy="330" rx="180" ry="230" fill="#143657" />

  <!-- Dignified Portrait Silhouette / Representation -->
  <!-- Suit / Formal Blazer -->
  <path d="M 180 560 C 200 440, 240 400, 300 400 C 360 400, 400 440, 420 560 Z" fill="#0A1826" />
  <!-- White Dress Shirt &amp; Gold Tie -->
  <polygon points="280,400 320,400 305,480 295,480" fill="#FFFFFF" />
  <polygon points="296,415 304,415 306,470 300,485 294,470" fill="url(#goldLuxe)" />
  <!-- Suit Lapels -->
  <polygon points="255,400 280,470 270,540 230,440" fill="#0F2840" />
  <polygon points="345,400 320,470 330,540 370,440" fill="#0F2840" />
  <!-- Neck -->
  <rect x="282" y="360" width="36" height="45" fill="#F4B282" />
  <!-- Face -->
  <ellipse cx="300" cy="310" rx="55" ry="68" fill="#F8C29D" />
  <!-- Academic Glasses -->
  <circle cx="282" cy="305" r="14" fill="none" stroke="#D4AF65" stroke-width="2.5" />
  <circle cx="318" cy="305" r="14" fill="none" stroke="#D4AF65" stroke-width="2.5" />
  <line x1="296" y1="305" x2="304" y2="305" stroke="#D4AF65" stroke-width="2.5" />
  <!-- Friendly, Wise Expression -->
  <path d="M 275 285 Q 285 280, 292 285" fill="none" stroke="#4A3427" stroke-width="2" />
  <path d="M 308 285 Q 315 280, 325 285" fill="none" stroke="#4A3427" stroke-width="2" />
  <path d="M 292 338 Q 300 345, 308 338" fill="none" stroke="#8C442A" stroke-width="2.5" stroke-linecap="round" />
  <!-- Distinguished Grey/Dark Hair -->
  <path d="M 242 290 C 242 230, 270 215, 300 215 C 330 215, 358 230, 358 290 C 352 260, 335 240, 300 240 C 265 240, 248 260, 242 290 Z" fill="#4A5568" />
  <path d="M 250 250 C 270 230, 300 225, 325 230" fill="none" stroke="#CBD5E0" stroke-width="3" opacity="0.6" />

  <!-- Gold Laurel Wreath Embellishment at Base -->
  <g fill="url(#goldLuxe)" transform="translate(180, 520) scale(0.6)">
    <path d="M 50 100 Q 150 160, 200 130 Q 150 180, 50 100 Z" />
    <path d="M 350 100 Q 250 160, 200 130 Q 250 180, 350 100 Z" />
    <circle cx="200" cy="130" r="14" fill="url(#goldLuxe)" />
  </g>

  <!-- Nameplate Plaque at Bottom -->
  <rect x="80" y="580" width="440" height="85" rx="6" fill="#102B45" stroke="url(#goldLuxe)" stroke-width="2" filter="url(#cardDrop)" />
  <text x="300" y="614" font-family="'Playfair Display', serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    OFFICE OF THE PRINCIPAL
  </text>
  <text x="300" y="640" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#D4AF65" text-anchor="middle" letter-spacing="2">
    S. P. PATEL PUBLIC SCHOOL • PRAYAGRAJ
  </text>

</svg>