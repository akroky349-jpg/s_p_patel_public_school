<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="800" height="550" fill="url(#skyGrad)" />
  <path d="M 0 350 Q 400 330, 800 350 L 800 550 L 0 550 Z" fill="url(#grassGrad)" />
  <!-- Grand Gate Pillars -->
  <rect x="80" y="160" width="80" height="260" fill="url(#stoneGrad)" stroke="#102B45" stroke-width="2" />
  <polygon points="70,160 120,120 170,160" fill="url(#navyDeep)" stroke="#D4AF65" stroke-width="2" />
  <circle cx="120" cy="140" r="10" fill="url(#goldLuxe)" />
  
  <rect x="640" y="160" width="80" height="260" fill="url(#stoneGrad)" stroke="#102B45" stroke-width="2" />
  <polygon points="630,160 680,120 730,160" fill="url(#navyDeep)" stroke="#D4AF65" stroke-width="2" />
  <circle cx="680" cy="140" r="10" fill="url(#goldLuxe)" />

  <!-- Wrought Iron Entrance Arch with Gold Lettering -->
  <path d="M 160 220 Q 400 120, 640 220" fill="none" stroke="url(#navyDeep)" stroke-width="16" />
  <path d="M 160 220 Q 400 120, 640 220" fill="none" stroke="url(#goldLuxe)" stroke-width="4" />
  <path id="archText" d="M 170 215 Q 400 125, 630 215" fill="none" />
  <text font-family="'Playfair Display', serif" font-size="17" font-weight="700" fill="#D4AF65" letter-spacing="2">
    <textPath href="#archText" startOffset="50%" text-anchor="middle">S. P. PATEL PUBLIC SCHOOL</textPath>
  </text>

  <!-- Ornate Iron Gate Grill (Open) -->
  <g stroke="#D4AF65" stroke-width="2" opacity="0.8">
    <line x1="160" y1="220" x2="260" y2="280" />
    <line x1="260" y1="280" x2="260" y2="420" />
    <line x1="640" y1="220" x2="540" y2="280" />
    <line x1="540" y1="280" x2="540" y2="420" />
  </g>

  <!-- Pathway into campus -->
  <polygon points="260,550 540,550 480,360 320,360" fill="#E2E8F0" />
  
  <!-- Modern Building Background -->
  <rect x="240" y="240" width="320" height="120" fill="#FFFFFF" stroke="#102B45" stroke-width="2" opacity="0.95" />
  <g fill="url(#glassGrad)" stroke="#102B45">
    <rect x="260" y="260" width="40" height="30" />
    <rect x="320" y="260" width="40" height="30" />
    <rect x="380" y="260" width="40" height="30" />
    <rect x="440" y="260" width="40" height="30" />
    <rect x="500" y="260" width="40" height="30" />
  </g>

  <!-- Welcoming Teachers &amp; Students -->
  <!-- Female Teacher -->
  <circle cx="370" cy="400" r="12" fill="#ED8936" />
  <path d="M 358 415 L 382 415 L 386 480 L 354 480 Z" fill="#D4AF65" />
  <path d="M 360 415 L 372 450 L 384 415" fill="#102B45" opacity="0.3" />
  
  <!-- Male Teacher -->
  <circle cx="430" cy="395" r="12" fill="#F6AD55" />
  <rect x="420" y="410" width="20" height="35" rx="3" fill="#102B45" />
  <line x1="426" y1="445" x2="426" y2="480" stroke="#2D3748" stroke-width="5" />
  <line x1="434" y1="445" x2="434" y2="480" stroke="#2D3748" stroke-width="5" />

  <!-- Happy Students -->
  <circle cx="400" cy="430" r="9" fill="#FBD38D" />
  <rect x="393" y="440" width="14" height="24" rx="2" fill="#102B45" />
  <line x1="396" y1="464" x2="396" y2="490" stroke="#4A5568" stroke-width="3" />
  <line x1="404" y1="464" x2="404" y2="490" stroke="#4A5568" stroke-width="3" />

  <!-- Badge banner -->
  <rect x="30" y="480" width="260" height="45" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="45" y="508" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">WELCOME TO CAMPUS</text>

</svg>