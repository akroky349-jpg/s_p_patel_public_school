<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="#F0F9FF" />
  <rect x="0" y="0" width="700" height="300" fill="#E0F2FE" />
  <!-- Clean Water Wave Graphics -->
  <path d="M 0 160 Q 175 120, 350 160 T 700 160 L 700 300 L 0 300 Z" fill="#BAE6FD" opacity="0.6" />
  <circle cx="350" cy="90" r="40" fill="#0284C7" />
  <!-- Water Droplet -->
  <path d="M 350 65 C 335 85, 330 95, 330 105 C 330 116, 339 125, 350 125 C 361 125, 370 116, 370 105 C 370 95, 365 85, 350 65 Z" fill="#FFFFFF" />
  <text x="350" y="195" font-family="'Playfair Display', serif" font-size="20" font-weight="700" fill="#0369A1" text-anchor="middle">Hygienic RO Drinking Water &amp; Sanitation</text>
  <text x="350" y="225" font-family="'DM Sans', sans-serif" font-size="13" fill="#0284C7" text-anchor="middle">Multi-Stage Filtration • Continuous Sanitation • Eco-Friendly Facilities</text>
  <polygon points="0,480 700,480 700,300 0,300" fill="#E2E8F0" />
  <!-- Clean Stainless Steel RO Dispenser -->
  <rect x="280" y="290" width="140" height="110" rx="6" fill="#94A3B8" stroke="#475569" stroke-width="2" />
  <rect x="300" y="310" width="100" height="40" rx="3" fill="#E2E8F0" />
  <!-- Title Tag -->
  <rect x="20" y="420" width="290" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">PURE RO WATER &amp; CLEAN SANITATION</text>

</svg>