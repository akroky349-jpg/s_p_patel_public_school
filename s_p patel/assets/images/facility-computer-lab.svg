<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="#0B132B" />
  <!-- Code on Screens -->
  <g fill="#1C2541">
    <rect x="60" y="80" width="160" height="100" rx="4" stroke="#48CAE4" stroke-width="2" />
    <rect x="270" y="80" width="160" height="100" rx="4" stroke="#48CAE4" stroke-width="2" />
    <rect x="480" y="80" width="160" height="100" rx="4" stroke="#48CAE4" stroke-width="2" />
  </g>
  <g fill="#48CAE4" opacity="0.8">
    <line x1="75" y1="105" x2="180" y2="105" stroke="#48CAE4" stroke-width="2" />
    <line x1="75" y1="120" x2="140" y2="120" stroke="#48CAE4" stroke-width="2" />
    <line x1="75" y1="135" x2="195" y2="135" stroke="#48CAE4" stroke-width="2" />
    <line x1="285" y1="105" x2="390" y2="105" stroke="#48CAE4" stroke-width="2" />
    <line x1="285" y1="120" x2="350" y2="120" stroke="#48CAE4" stroke-width="2" />
    <line x1="495" y1="105" x2="600" y2="105" stroke="#48CAE4" stroke-width="2" />
  </g>
  <!-- Floor &amp; Desks -->
  <polygon points="0,480 700,480 700,260 0,260" fill="#1C2541" />
  <rect x="30" y="280" width="640" height="80" rx="4" fill="#0B132B" stroke="#3A506B" stroke-width="2" />
  <!-- Keyboards -->
  <rect x="90" y="300" width="100" height="20" rx="2" fill="#3A506B" />
  <rect x="300" y="300" width="100" height="20" rx="2" fill="#3A506B" />
  <rect x="510" y="300" width="100" height="20" rx="2" fill="#3A506B" />
  <!-- Title Tag -->
  <rect x="20" y="420" width="280" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">ADVANCED COMPUTER IT CENTRE</text>

</svg>