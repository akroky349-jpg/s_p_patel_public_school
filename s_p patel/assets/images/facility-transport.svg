<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="60%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="navyDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102B45" />
      <stop offset="100%" stop-color="#081726" />
    </linearGradient>
    <linearGradient id="goldLuxe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#D4AF65" />
      <stop offset="100%" stop-color="#9C782B" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2847A" />
      <stop offset="100%" stop-color="#B85449" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#D6CEBE" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF8FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#90CDF4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2438" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <rect width="700" height="480" fill="url(#skyGrad)" />
  <polygon points="0,480 700,480 700,320 0,320" fill="#475569" />
  <!-- Yellow School Bus -->
  <rect x="120" y="160" width="460" height="200" rx="16" fill="#FACC15" stroke="#102B45" stroke-width="3" />
  <!-- Bus Windows -->
  <g fill="url(#glassGrad)" stroke="#102B45" stroke-width="2">
    <rect x="150" y="180" width="60" height="60" rx="4" />
    <rect x="230" y="180" width="60" height="60" rx="4" />
    <rect x="310" y="180" width="60" height="60" rx="4" />
    <rect x="390" y="180" width="60" height="60" rx="4" />
    <rect x="470" y="180" width="75" height="70" rx="4" />
  </g>
  <!-- Bus Name Strip -->
  <rect x="120" y="260" width="460" height="36" fill="#102B45" />
  <text x="350" y="284" font-family="'DM Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">S. P. PATEL PUBLIC SCHOOL - BUS NO. 04</text>
  <!-- Wheels -->
  <circle cx="210" cy="360" r="38" fill="#1E293B" stroke="#64748B" stroke-width="6" />
  <circle cx="210" cy="360" r="14" fill="#CBD5E1" />
  <circle cx="480" cy="360" r="38" fill="#1E293B" stroke="#64748B" stroke-width="6" />
  <circle cx="480" cy="360" r="14" fill="#CBD5E1" />
  <!-- Title Tag -->
  <rect x="20" y="420" width="280" height="42" rx="4" fill="url(#navyDeep)" stroke="url(#goldLuxe)" stroke-width="1.5" />
  <text x="35" y="446" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">SAFE GPS-ENABLED TRANSPORT FLEET</text>

</svg>